<style>
  :root {
    --bg: #ebe9e3;
    --surface: #fbfaf6;
    --ink: #1e1b17;
    --muted: #6b6358;
    --line: #4a4237;
    --accent: #a8740c;
    --accent-soft: #f1e2bf;
    --res: #e2dbcb;
    --pill: #dcd4c3;
    --rule: #d3ccbd;
    --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
    --body: "Rubik", system-ui, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15120e;
      --surface: #221d16;
      --ink: #efe6d2;
      --muted: #a89c86;
      --line: #c7b894;
      --accent: #f0b429;
      --accent-soft: #3b2f16;
      --res: #2e271d;
      --pill: #342b20;
      --rule: #3a3226;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15120e;
    --surface: #221d16;
    --ink: #efe6d2;
    --muted: #a89c86;
    --line: #c7b894;
    --accent: #f0b429;
    --accent-soft: #3b2f16;
    --res: #2e271d;
    --pill: #342b20;
    --rule: #3a3226;
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px 56px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 12px;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.05;
    text-wrap: balance;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    margin: 24px 0 0;
    padding: 14px 16px;
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  section { margin-top: 40px; }
  h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    text-wrap: balance;
  }
  .num { color: var(--accent); }
  figure { margin: 12px 0 0; }
  .scroll { overflow-x: auto; }
  figcaption { margin-top: 10px; max-width: 68ch; font-size: 14px; color: var(--muted); }

  /* Flowcharts: element types differ by shape; the accent marks only where the player's skill is judged. */
  .fc { display: block; width: 100%; min-width: 560px; height: auto; }
  .fc.lg { width: 40px; min-width: 0; height: 26px; flex: none; }
  .fc text { font-family: var(--body); font-size: 13px; fill: var(--ink); }
  .fc .t { text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
  .fc .s { font-size: 11px; font-weight: 400; fill: var(--muted); }
  .fc .l { font-size: 11px; fill: var(--muted); dominant-baseline: middle; }
  .fc .m { text-anchor: middle; }
  .fc .sh { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .fc .pill { fill: var(--pill); }
  .fc .goal { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .fc .res { fill: var(--res); }
  .fc .skill { stroke: var(--accent); stroke-width: 2.5; }
  .fc .conn { fill: var(--pill); stroke: var(--line); stroke-width: 1.5; }
  .fc .cn { font-family: var(--display); font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  .fc .e { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .fc .d { stroke-dasharray: 5 4; }
  .fc .ah { fill: var(--line); }

  /* Print: the title and legend share a page with chart 1, then one chart per page, each shrunk to fit. */
  @page { size: A4; margin: 0; }
  @media print {
    body { padding: 12mm; }
    section { break-inside: avoid; }
    section + section { break-before: page; margin-top: 0; }
    .fc:not(.lg) { min-width: 0; width: auto; max-width: 100%; max-height: 205mm; margin: 0 auto; }
    section:first-of-type .fc { max-height: 190mm; }
    .legend { margin-top: 12px; }
    section:first-of-type { margin-top: 16px; }
  }
</style>

  <!-- ============================================================ 1. the run -->
  <section>
    <h2><span class="num">1</span> · Sefer</h2>
    <figure>
      <div class="scroll">
        <svg class="fc" viewBox="0 0 650 1236" role="img" aria-label="Sefer akışı: sefere çık, bölüm başlar. Nefes arasında sıradaki dalga görünür ve sancağın altına yürünür. Dalga başlar; hedefi düşmanı dağıtmak, ileri karakolu basmak, kaleyi yıkmak ya da bossu yenmektir. Her vuruşta savaşılır. Kalp kalmadıysa sefer biter. Hedef tamam değilse savaş sürer. Tamamsa zafer; bölümün beşinci dalgası değilse sonraki dalgaya geçilir. Beşinci dalgaysa konakta dinlenip ordu ve ulti yuvaları düzenlenir. Son bölümse sefer tamamlanır, değilse sonraki bölüm başlar.">
          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <rect class="sh pill" x="220" y="16" width="160" height="40" rx="20"/>
          <text class="t" x="300" y="36">Sefere çık</text>
          <path class="e" d="M300 56 V86" marker-end="url(#a1)"/>
          <text class="l" x="312" y="71">ilk seferde: 3 adımlık eğitim</text>

          <rect class="sh" x="150" y="86" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="104">Bölüm başlar</text>
          <text class="t s" x="300" y="124">ileri karakollar · kaleler · bosslar</text>
          <path class="e" d="M300 138 V168" marker-end="url(#a1)"/>

          <rect class="sh" x="150" y="168" width="300" height="44" rx="6"/>
          <text class="t" x="300" y="190">Nefes arası: sıradaki dalga görünür</text>
          <path class="e" d="M300 212 V242" marker-end="url(#a1)"/>

          <polygon class="sh" points="170,242 450,242 430,286 150,286"/>
          <text class="t" x="300" y="264">Sancağın altına yürü</text>
          <path class="e" d="M300 286 V316" marker-end="url(#a1)"/>
          <text class="l" x="312" y="301">o dalgada gelecek asker</text>

          <rect class="sh" x="130" y="316" width="340" height="72" rx="6"/>
          <text class="t" x="300" y="336">Dalga başlar</text>
          <text class="t s" x="300" y="356">hedef: düşmanı dağıt · ileri karakolu bas</text>
          <text class="t s" x="300" y="373">kaleyi yık · bossu yen</text>
          <path class="e" d="M300 388 V418" marker-end="url(#a1)"/>

          <rect class="sh" x="150" y="418" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="436">Her vuruşta çal, ordu savaşır</text>
          <text class="t s" x="300" y="456">ayrıntısı 2., 3. ve 4. şemada</text>
          <path class="e" d="M300 470 V500" marker-end="url(#a1)"/>

          <!-- hearts -->
          <polygon class="sh" points="300,500 410,550 300,600 190,550"/>
          <text class="t" x="300" y="550">Kalp kaldı mı?</text>
          <path class="e" d="M410 550 H440" marker-end="url(#a1)"/>
          <text class="l m" x="425" y="538">hayır</text>
          <rect class="sh pill" x="440" y="530" width="130" height="40" rx="20"/>
          <text class="t" x="505" y="550">Sefer biter</text>
          <circle class="conn" cx="100" cy="550" r="18"/>

          <text class="l m" x="100" y="584">3. şemadan</text>
          <path class="e" d="M118 550 H190" marker-end="url(#a1)"/>
          <text class="l m" x="154" y="538">kalp kaybı</text>
          <path class="e" d="M300 600 V630" marker-end="url(#a1)"/>
          <text class="l" x="310" y="615">evet</text>

          <!-- goal -->

          <text class="t" x="300" y="680">Hedef tamam mı?</text>
          <path class="e" d="M410 680 H598 V444 H450" marker-end="url(#a1)"/>

          <path class="e" d="M300 730 V760" marker-end="url(#a1)"/>

          <text class="t" x="300" y="876">Bölümün</text>
          <text class="t" x="300" y="894">5. dalgası mıydı?</text>

          <text class="l m" x="528" y="872">hayır: sonraki dalga</text>
          <path class="e" d="M300 934 V964" marker-end="url(#a1)"/>
          <text class="l" x="310" y="949">evet</text>

          <!-- konak -->
          <polygon class="sh" points="170,964 450,964 430,1016 150,1016"/>
          <text class="t" x="300" y="982">Konak: dinlen ve düzenle</text>
          <text class="t s" x="300" y="1002">ordu · 4 ulti yuvası (4. şema)</text>

      <figcaption>İlk seferde kısa bir eğitim var: altında VUR, kırmızıda DİREN, sonra ikisi karışık. Sefer bölümlerden, her bölüm beş dalgadan oluşur. Dalgalar arasındaki nefes arasında sıradaki dalga görünür ve sancak seçilir. Her dalganın bir hedefi vardır: düşmanı dağıtmak, ileri karakolu basmak, kaleyi yıkmak ya da bossu yenmek. Beşinci dalgadan sonra konakta dinlenilir, ordu ve dört ulti yuvası düzenlenir, ardından bölüm değişir. Kalpler biterse sefer biter. Tempo sefer boyunca sabittir.</figcaption>

  <!-- ============================================================ 2. every beat -->
  <section>
    <h2><span class="num">2</span> · Her vuruş</h2>
    <figure>
      <div class="scroll">
        <svg class="fc" viewBox="0 0 650 520" role="img" aria-label="Her vuruşun akışı: aura basma anına doğru ısınır; altınsa vuruş boştur, kırmızıysa düşman saldırıyordur. Oyuncu bir çalgıya basar. Doğru çalgı değilse ya da tam zamanında değilse Cezbe düşer. Doğru ve zamanındaysa Cezbe yükselir ve asker sayacı artar, emir verilir ve orduya geçer, sonra sıradaki vuruş gelir. Her Cezbe kademesi askerlerin canını, hasarını ve hızını artırır.">

            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <circle class="conn" cx="260" cy="24" r="18"/>

          <text class="l" x="286" y="24">1. şemadan: dalga sürerken</text>
          <path class="e" d="M260 42 V70" marker-end="url(#a2)"/>

          <rect class="sh" x="120" y="70" width="280" height="44" rx="6"/>
          <text class="t" x="260" y="92">Aura rengi basma anına ısınır</text>
          <path class="e" d="M260 114 V144" marker-end="url(#a2)"/>

          <polygon class="sh" points="145,144 395,144 375,188 125,188"/>

          <text class="l m" x="407" y="261">hayır</text>
          <rect class="sh" x="440" y="247" width="180" height="52" rx="6"/>

          <path class="e d" d="M530 295 V344" marker-end="url(#a2)"/>
          <text class="l" x="540" y="320">−</text>

          <path class="e" d="M260 328 V358" marker-end="url(#a2)"/>

          <path class="e d" d="M420 384 H450" marker-end="url(#a2)"/>

          <text class="cn" x="530" y="466">3</text>

          <polygon class="sh" points="170,188 270,238 170,288 70,238"/>
          <text class="t" x="170" y="238">Düşman öldü mü?</text>
          <path class="e" d="M70 238 H24 V132 H50" marker-end="url(#a3)"/>
          <text class="l m" x="47" y="226">hayır</text>
          <path class="e" d="M170 288 V318" marker-end="url(#a3)"/>

          <path class="sh res" d="M110 326 V366 A60 8 0 0 0 230 366 V326"/>
