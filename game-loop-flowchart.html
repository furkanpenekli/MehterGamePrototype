<!doctype html>
<!-- Standalone copy of the artifact at https://claude.ai/artifact/FwPr9DGTgeqkL68o5x5XNU . The artifact host adds its own
     skeleton, so republish only what sits between <head> and </body>, without this wrapper.
     Since 2026-09-26 it draws prototype 3 (mehter-seferi-v3.html), which the artifact does not show yet. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mehter Sefer Akışı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Rubik:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #ebe9e3;
    --surface: #fbfaf6;
    --ink: #1e1b17;
    --muted: #6b6358;
    --line: #4a4237;
    --accent: #a8740c;
    --accent-soft: #f1e2bf;
    --res: #e2dbcb;
    --pill: #dcd4c3;
    --rule: #d3ccbd;
    --display: "Alfa Slab One", Rockwell, "Roboto Slab", Georgia, serif;
    --body: "Rubik", system-ui, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15120e;
      --surface: #221d16;
      --ink: #efe6d2;
      --muted: #a89c86;
      --line: #c7b894;
      --accent: #f0b429;
      --accent-soft: #3b2f16;
      --res: #2e271d;
      --pill: #342b20;
      --rule: #3a3226;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15120e;
    --surface: #221d16;
    --ink: #efe6d2;
    --muted: #a89c86;
    --line: #c7b894;
    --accent: #f0b429;
    --accent-soft: #3b2f16;
    --res: #2e271d;
    --pill: #342b20;
    --rule: #3a3226;
    color-scheme: dark;
  }
  body {
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px 56px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
  }
  main { max-width: 820px; margin: 0 auto; }
  .eyebrow {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    margin: 0 0 12px;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(30px, 5vw, 44px);
    line-height: 1.05;
    text-wrap: balance;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 20px;
    margin: 24px 0 0;
    padding: 14px 16px;
    border: 1px solid var(--rule);
    border-radius: 10px;
  }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  section { margin-top: 40px; }
  h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: 22px;
    text-wrap: balance;
  }
  .num { color: var(--accent); }
  figure { margin: 12px 0 0; }
  .scroll { overflow-x: auto; }
  figcaption { margin-top: 10px; max-width: 68ch; font-size: 14px; color: var(--muted); }

  /* Flowcharts: element types differ by shape; the accent marks only where the player's skill is judged. */
  .fc { display: block; width: 100%; min-width: 560px; height: auto; }
  .fc.lg { width: 40px; min-width: 0; height: 26px; flex: none; }
  .fc text { font-family: var(--body); font-size: 13px; fill: var(--ink); }
  .fc .t { text-anchor: middle; dominant-baseline: middle; font-weight: 500; }
  .fc .s { font-size: 11px; font-weight: 400; fill: var(--muted); }
  .fc .l { font-size: 11px; fill: var(--muted); dominant-baseline: middle; }
  .fc .m { text-anchor: middle; }
  .fc .sh { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .fc .pill { fill: var(--pill); }
  .fc .goal { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .fc .res { fill: var(--res); }
  .fc .skill { stroke: var(--accent); stroke-width: 2.5; }
  .fc .conn { fill: var(--pill); stroke: var(--line); stroke-width: 1.5; }
  .fc .cn { font-family: var(--display); font-size: 15px; text-anchor: middle; dominant-baseline: central; }
  .fc .e { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .fc .d { stroke-dasharray: 5 4; }
  .fc .ah { fill: var(--line); }

  /* Print: the title and legend share a page with chart 1, then one chart per page, each shrunk to fit. */
  @page { size: A4; margin: 0; }
  @media print {
    body { padding: 12mm; }
    section { break-inside: avoid; }
    section + section { break-before: page; margin-top: 0; }
    .fc:not(.lg) { min-width: 0; width: auto; max-width: 100%; max-height: 205mm; margin: 0 auto; }
    section:first-of-type .fc { max-height: 190mm; }
    .legend { margin-top: 12px; }
    section:first-of-type { margin-top: 16px; }
  }
</style>
</head>

  <!-- ============================================================ 0. the konak -->
  <section>
    <h2><span class="num">0</span> · Konak</h2>
    <figure>
      <div class="scroll">
        <svg class="fc" viewBox="0 0 650 530" role="img" aria-label="Konak akışı: konağa girilir. Mehterhane Konağı'nın avlusunda yürünür; tempo sürer ve çalgılar talim için çalınır. Dört kişiye gidilebilir, istenen sırada ve istendiği kadar: Kethüda şanla kalıcı gelişme satar, Bayraktar başlangıç bölüğünü ve dört ulti yuvasını tutar, Talimci kuklada talim ve gecikme ayarı sunar, Vakanüvis seferleri ve canavarları yazar. Hazır olunca kapıdan sefere çıkılır. Sefer nasıl biterse bitsin şan deftere yazılır ve avluya dönülür.">
          <defs>
            <marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <rect class="sh pill" x="220" y="16" width="160" height="40" rx="20"/>
          <text class="t" x="300" y="36">Konağa gir</text>
          <path class="e" d="M300 56 V86" marker-end="url(#a0)"/>
          <text class="l" x="312" y="71">başlık ekranından</text>

          <rect class="sh" x="150" y="86" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="104">Mehterhane Konağı: avluda yürü</text>
          <text class="t s" x="300" y="124">tempo sürer · çalgılar talim için çalınır</text>

          <!-- the four people, in any order, as often as wanted -->
          <path class="e" d="M300 138 V158 M110 158 H530"/>
          <path class="e" d="M110 158 V184" marker-end="url(#a0)"/>
          <path class="e" d="M250 158 V184" marker-end="url(#a0)"/>
          <path class="e" d="M390 158 V184" marker-end="url(#a0)"/>
          <path class="e" d="M530 158 V184" marker-end="url(#a0)"/>
          <polygon class="sh" points="55,184 175,184 165,244 45,244"/>
          <text class="t" x="110" y="205">Kethüda</text>
          <text class="t s" x="110" y="224">şanla gelişme</text>
          <polygon class="sh" points="195,184 315,184 305,244 185,244"/>
          <text class="t" x="250" y="205">Bayraktar</text>
          <text class="t s" x="250" y="224">bölük · 4 ulti</text>
          <polygon class="sh" points="335,184 455,184 445,244 325,244"/>
          <text class="t" x="390" y="205">Talimci</text>
          <text class="t s" x="390" y="224">kukla · gecikme</text>
          <polygon class="sh" points="475,184 595,184 585,244 465,244"/>
          <text class="t" x="530" y="205">Vakanüvis</text>
          <text class="t s" x="530" y="224">kayıtlar</text>
          <path class="e" d="M110 244 V266 M250 244 V266 M390 244 V266 M530 244 V266 M110 266 H624 V112 H450" marker-end="url(#a0)"/>
          <text class="l m" x="638" y="190" transform="rotate(-90 638 190)">avluya dön</text>

          <!-- the gate -->
          <path class="e" d="M150 112 H22 V330 H166" marker-end="url(#a0)"/>
          <text class="l m" x="12" y="220" transform="rotate(-90 12 220)">hazır olunca</text>
          <polygon class="sh" points="176,308 440,308 424,352 160,352"/>
          <text class="t" x="300" y="324">Kapıdan çık</text>
          <text class="t s" x="300" y="341">ilk seferde önce eğitim</text>

          <text class="cn" x="300" y="400">1</text>
          <text class="l" x="326" y="400">sefer</text>

          <!-- back from the run -->
          <circle class="conn" cx="80" cy="480" r="18"/>
          <text class="cn" x="80" y="480">1</text>
          <text class="l m" x="80" y="512">1. şemadan</text>
          <path class="e" d="M98 480 H150" marker-end="url(#a0)"/>
          <rect class="sh" x="150" y="454" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="472">Şan deftere yazılır</text>
          <text class="t s" x="300" y="492">lider düşse, sefer bırakılsa ya da tamamlansa</text>
          <path class="e" d="M450 480 H624 V266"/>
        </svg>

      <figcaption>Her sefer Mehterhane Konağı'ndan başlar ve orada biter. Avluda yürünür; tempo sürer ve çalgılar talim için çalınabilir. Kethüda seferde kazanılan şanla kalıcı gelişmeler satar; Bayraktar sefere çıkılacak bölüğü ve dört ulti yuvasını tutar; Talimci'nin yanında kukla, gecikme ayarı ve eğitim vardır; Vakanüvis seferleri ve görülen canavarları yazar. Hazır olunca kuzeydeki kapıdan sefere çıkılır. Sefer nasıl biterse bitsin (lider düşer, sefer bırakılır ya da üç bölüm geçilir) kazanılan şan deftere yazılır ve konağa dönülür.</figcaption>
    </figure>
  </section>

  <!-- ============================================================ 1. the run -->
  <section>
    <h2><span class="num">1</span> · Sefer</h2>
    <figure>
      <div class="scroll">
        <svg class="fc" viewBox="0 0 650 1236" role="img" aria-label="Sefer akışı: konaktan sefere çıkılır, bölüm başlar. Nefes arasında sıradaki dalga görünür ve sancağın altına yürünür. Dalga başlar; hedefi canavarları dağıtmak, bir baskın, bir kuşatma ya da bölümün serdarını yenmektir. Gerçek zamanlı savaşılır. Kalp kalmadıysa sefer biter. Hedef tamam değilse savaş sürer. Tamamsa zafer; bölümün beşinci dalgası değilse sonraki dalgaya geçilir. Beşinci dalgaysa konakta dinlenip ordu ve ulti yuvaları düzenlenir; sonraki bölümün teması ve canavarları başkadır. Son bölümse sefer tamamlanır, değilse sonraki bölüm başlar. Sefer biterse de tamamlanırsa da konağa dönülür.">
          <defs>
            <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <circle class="conn" cx="100" cy="36" r="18"/>
          <text class="cn" x="100" y="36">0</text>
          <text class="l m" x="100" y="68">konaktan</text>
          <path class="e" d="M118 36 H220" marker-end="url(#a1)"/>
          <rect class="sh pill" x="220" y="16" width="160" height="40" rx="20"/>
          <text class="t" x="300" y="36">Sefere çık</text>
          <path class="e" d="M300 56 V86" marker-end="url(#a1)"/>
          <text class="l" x="312" y="71">ilk seferde: 4 adımlık eğitim</text>

          <rect class="sh" x="150" y="86" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="104">Bölüm başlar</text>
          <text class="t s" x="300" y="124">kendi canavarları · baskınlar · serdarı</text>
          <path class="e" d="M300 138 V168" marker-end="url(#a1)"/>

          <rect class="sh" x="150" y="168" width="300" height="44" rx="6"/>
          <text class="t" x="300" y="190">Nefes arası: sıradaki dalga görünür</text>
          <path class="e" d="M300 212 V242" marker-end="url(#a1)"/>

          <polygon class="sh" points="170,242 450,242 430,286 150,286"/>
          <text class="t" x="300" y="264">Sancağın altına yürü</text>
          <path class="e" d="M300 286 V316" marker-end="url(#a1)"/>
          <text class="l" x="312" y="301">o dalgada gelecek asker</text>

          <rect class="sh" x="130" y="316" width="340" height="72" rx="6"/>
          <text class="t" x="300" y="336">Dalga başlar</text>
          <text class="t s" x="300" y="356">hedef: canavarları dağıt · baskın</text>
          <text class="t s" x="300" y="373">kuşatma · serdarı yen</text>
          <path class="e" d="M300 388 V418" marker-end="url(#a1)"/>

          <rect class="sh" x="150" y="418" width="300" height="52" rx="6"/>
          <text class="t" x="300" y="436">Dilediğin an çal, ordu savaşır</text>
          <text class="t s" x="300" y="456">gerçek zamanlı · ayrıntısı 2., 3. ve 4. şemada</text>
          <path class="e" d="M300 470 V500" marker-end="url(#a1)"/>

          <!-- hearts -->
          <polygon class="sh" points="300,500 410,550 300,600 190,550"/>
          <text class="t" x="300" y="550">Kalp kaldı mı?</text>
          <path class="e" d="M410 550 H440" marker-end="url(#a1)"/>

          <rect class="sh pill" x="440" y="530" width="130" height="40" rx="20"/>

          <text class="cn" x="505" y="618">0</text>
          <text class="l" x="530" y="618">konağa</text>
          <circle class="conn" cx="100" cy="550" r="18"/>
          <text class="cn" x="100" y="550">3</text>
          <text class="l m" x="100" y="584">3. şemadan</text>
          <path class="e" d="M118 550 H190" marker-end="url(#a1)"/>
          <text class="l m" x="154" y="538">kalp kaybı</text>
          <path class="e" d="M300 600 V630" marker-end="url(#a1)"/>

          <!-- goal -->
          <polygon class="sh" points="300,630 410,680 300,730 190,680"/>

          <path class="e" d="M300 730 V760" marker-end="url(#a1)"/>
          <text class="l" x="310" y="745">evet</text>

          <rect class="sh" x="150" y="760" width="300" height="44" rx="6"/>
          <text class="t" x="300" y="782">Zafer: altın</text>
          <path class="e" d="M300 804 V834" marker-end="url(#a1)"/>

          <!-- fifth wave -->

      <figcaption>Sefer konaktan başlar (0. şema). İlk seferde kısa bir eğitim var: dört çalgı sırayla, her birinin kazancı ve bedeli. Sefer bölümlerden, her bölüm beş dalgadan oluşur. Dalgalar arasındaki nefes arasında sıradaki dalga görünür ve sancak seçilir. Her dalganın bir hedefi vardır: canavarları dağıtmak, bir baskın (ağıl, yılan yuvası, kor ocağı), bir kuşatma ya da bölümün serdarını yenmek: Tepegöz, Şahmeran, Ejderha. Her dalga yeni bir canavar getirir. Beşinci dalgadan sonra konakta dinlenilir, ordu ve dört ulti yuvası düzenlenir, ardından bölüm ve teması değişir. Kalpler biterse sefer biter. Sefer biterse de tamamlanırsa da kazanılan şanla konağa dönülür. Oyun gerçek zamanlıdır; tempo sefer boyunca sabittir ve tempoya denk gelen çalgı ödüllendirilir.</figcaption>

  <!-- ============================================================ 2. every press -->
  <section>
    <h2><span class="num">2</span> · Her çalgı</h2>
    <figure>
      <div class="scroll">
        <svg class="fc" viewBox="0 0 650 710" role="img" aria-label="Her çalgının akışı: tempo her 0.75 saniyede vurur ve aura her vuruşa doğru ısınır; lidere bir darbe ya da toplu hücum yaklaşıyorsa kırmızıya ısınır. Oyuncu dört çalgıdan birini kendi seçer ve dilediği an çalar. Çalgı hazır değilse yalnız tık sesi çıkar ve beklenir. Hazırsa, tempoya denk gelip gelmediğine bakılır. Denk geldiyse Cezbe yükselir, Perfect emri güçlendirir ve bekleme süresi kısalır. Denk gelmediyse emir zayıf gider ve Cezbe yükselmez. İki durumda da emir verilir, çalgı bekleme süresine girer ve emir orduya geçer; sonra sıradaki çalgı gelir.">
          <defs>
            <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
          </defs>

          <circle class="conn" cx="260" cy="24" r="18"/>
          <text class="cn" x="260" y="24">1</text>
          <text class="l" x="286" y="24">1. şemadan: dalga sürerken</text>
          <path class="e" d="M260 42 V70" marker-end="url(#a2)"/>
